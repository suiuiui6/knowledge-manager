name: Public surface

on:
  push:
    branches: [main, master, "feat/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B tools/check_public_surface.py
