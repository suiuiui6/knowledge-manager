name: CI

on:
  push:
    branches: ["main", "master", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1
      - name: Install locked dependencies
        run: python -m poetry install --no-interaction
      - name: Run full test suite
        run: python -m poetry run pytest -q --junitxml=test-results/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/junit.xml

  quality:
    name: Static quality report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1
      - name: Install locked dependencies
        run: python -m poetry install --no-interaction
      - name: Check formatting
        run: python -m poetry run black --check src tests scripts
      - name: Check types
        run: python -m poetry run mypy src
