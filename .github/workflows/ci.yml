name: CI

on:
  push:
    branches: ["main", "master", "feat/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked project environment
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry install --no-interaction
      - name: Record dependency snapshot
        run: |
          mkdir -p test-results
          poetry run python --version > test-results/runtime.txt
          poetry --version >> test-results/runtime.txt
          sha256sum poetry.lock >> test-results/runtime.txt
          poetry run python -m pip freeze > test-results/dependencies.txt
      - name: Run full test suite
        run: poetry run pytest -q --junitxml=test-results/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python }}
          path: test-results/

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify wheel in a clean environment
        run: python scripts/verify_install_smoke.py

  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Formatting
            command: black --check src tests scripts
          - check: Types
            command: mypy src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked project environment
        run: |
          python -m pip install poetry==2.4.1
          poetry check --lock
          poetry install --no-interaction
      - name: Run quality gate
        run: poetry run ${{ matrix.command }}
