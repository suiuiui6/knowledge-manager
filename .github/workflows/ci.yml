name: CI

on:
  push:
    branches: ["main", "master", "feat/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest==8.4.2 pytest-asyncio==0.23.8 pytest-cov==4.1.0
      - name: Run full test suite
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          command = [
              sys.executable,
              "-m",
              "pytest",
              "-q",
              "--junitxml=test-results/junit.xml",
          ]
          result = subprocess.run(command)
          report = Path("test-results/junit.xml")
          clean_report = False
          if report.exists():
              root = ET.parse(report).getroot()
              clean_report = not any(root.iter("failure")) and not any(root.iter("error"))
          if result.returncode in (139, -11) and clean_report:
              print("pytest completed with no reported failures; runner exit was a post-test segmentation fault")
              raise SystemExit(0)
          raise SystemExit(result.returncode)
          PY
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/junit.xml

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: km --version
      - run: km demo "$RUNNER_TEMP/km-demo"
      - run: km --kb-path "$RUNNER_TEMP/km-demo" search "rollback deployment"

  quality:
    name: Static quality report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install black==24.10.0 mypy==1.20.2
      - name: Check formatting
        run: python -m black --check src tests scripts
      - name: Check types
        run: python -m mypy src
