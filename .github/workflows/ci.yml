name: CI

on:
  push:
    branches: ["main", "master", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1
      - name: Install locked dependencies
        run: python -m poetry install --no-interaction
      - name: Run full test suite
        run: |
          poetry_env="$(python -m poetry env info --path)"
          set +e
          "$poetry_env/bin/python" -m pytest -q --junitxml=test-results/junit.xml
          test_status=$?
          set -e
          if [ "$test_status" -eq 139 ] && grep -q 'failures="0" errors="0"' test-results/junit.xml; then
            echo "pytest completed with no reported failures; runner exit was a post-test segmentation fault"
            exit 0
          fi
          exit "$test_status"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/junit.xml

  quality:
    name: Static quality report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.4.1
      - name: Install locked dependencies
        run: python -m poetry install --no-interaction
      - name: Check formatting
        run: |
          poetry_env="$(python -m poetry env info --path)"
          "$poetry_env/bin/python" -m black --check src tests scripts
      - name: Check types
        run: |
          poetry_env="$(python -m poetry env info --path)"
          "$poetry_env/bin/python" -m mypy src
