[tool.poetry]
name = "knowledge-manager"
version = "0.5.1"
description = "Git-native structured knowledge modules for LLM agent workflows via MCP."
authors = ["Tang Yanhao <tangyanhao@example.com>"]
readme = "README.md"
license = "MIT"
keywords = ["knowledge-management", "mcp", "llm", "agent", "git-native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{include = "knowledge_manager", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
mcp = "^1.0.0"
pydantic = "^2.0.0"
click = "^8.0.0"
httpx = "^0.27.0"
rich = "^13.0.0"
snowballstemmer = "^2.2.0"
jieba = "^0.42.1"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
mypy = "^1.8.0"
pytest-cov = "^4.1.0"

[tool.poetry.scripts]
km = "knowledge_manager.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
