<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="demo-title demo-desc">
  <title id="demo-title">Knowledge Manager 30 second demo</title>
  <desc id="demo-desc">A terminal showing km demo, keyword search, and MCP server startup without an API key.</desc>
  <rect width="1200" height="560" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="558" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect width="1200" height="46" rx="18" fill="#161b22"/>
  <rect y="28" width="1200" height="18" fill="#161b22"/>
  <circle cx="26" cy="23" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="23" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="23" r="7" fill="#27c93f"/>
  <text x="102" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b949e">km demo - 30 seconds</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="42" y="96" fill="#f0f6fc">$ km demo ./km-demo</text>
    <text x="42" y="132" fill="#3fb950">Created demo knowledge base at ./km-demo</text>
    <text x="42" y="164" fill="#8b949e">  4 approved modules across 3 categories</text>
    <text x="42" y="196" fill="#d29922">  staged-oncall-handoff is staged for review</text>
    <text x="42" y="256" fill="#f0f6fc">$ km --kb-path ./km-demo search "rollback deployment"</text>
    <text x="42" y="292" fill="#58a6ff">agent-workflows/rollback-deployment - Roll back a failed deployment safely</text>
    <text x="42" y="324" fill="#8b949e">  A short runbook for detecting, containing, and reverting a failed release.</text>
    <text x="42" y="384" fill="#f0f6fc">$ km --kb-path ./km-demo serve</text>
    <text x="42" y="420" fill="#3fb950">MCP server ready on stdio</text>
    <text x="42" y="486" fill="#f0f6fc" font-weight="700">No API key required for the demo. No vector database.</text>
  </g>
</svg>
